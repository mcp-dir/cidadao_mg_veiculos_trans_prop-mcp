# Smithery configuration for Cidadão MG Veículos: Transferência de Propriedade de Veículo
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_cidadao_mg_veiculos_trans_prop

name: cidadao_mg_veiculos_trans_prop-mcp
displayName: "Cidadão MG Veículos: Transferência de Propriedade de Veículo"
description: >
  Cidadão MG Veículos: Transferência de Propriedade de Veículo, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/cidadao_mg_veiculos_trans_prop-mcp
repository: https://github.com/mcp-dir/cidadao_mg_veiculos_trans_prop-mcp

tags:
  - cidadao_mg_veiculos_trans_prop
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_cidadao_mg_veiculos_trans_prop

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_cidadao_mg_veiculos_trans_prop/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
